<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A tiny space for personal design experiments." />
    <title>Personal Designs ✦</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">a little corner for experiments ✦</p>
        <h1 id="page-title">Make something lovely.</h1>
        <p class="intro">A simple home for your design ideas, tiny prototypes, and things worth seeing.</p>
        <a class="button" href="#todo">Start with one small thing <span aria-hidden="true">→</span></a>
      </section>

      <section class="todo-card" id="todo" aria-labelledby="todo-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">today's tiny list</p>
            <h2 id="todo-title">Design practice</h2>
          </div>
          <span class="sparkle" aria-hidden="true">✦</span>
        </div>
        <form class="todo-form" id="todo-form">
          <label class="sr-only" for="todo-input">Add a design task</label>
          <input id="todo-input" name="task" type="text" placeholder="Add a small idea..." autocomplete="off" />
          <button class="button button-small" type="submit">Add</button>
        </form>
        <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
      </section>

      <footer>Built one small step at a time. <span aria-hidden="true">♡</span></footer>
    </main>
  </body>
</html>
